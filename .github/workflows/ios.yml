name: Build and test iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      neural_only:
        description: Run only the real model diagnostics
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
    needs: [download, neural, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Veil-unsigned-IPA
          path: build/artifacts
      - name: Publish verified unsigned IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_release.py
  download:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Check real native download progress and recovery
        run: |
          set -o pipefail
          mkdir -p build
          python3 -u scripts/download_fixture.py > build/download-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          swiftc -swift-version 6 -parse-as-library Sources/Neural/NeuralModelStore.swift Sources/Neural/ModelDownloads.swift Tools/DownloadSmoke.swift -o build/DownloadSmoke
          VEIL_DOWNLOAD_LIVE_ONLY=1 build/DownloadSmoke "$PWD/build/live-download-check" "$PWD/Sources/Neural/NeuralManifest.json"
          curl --fail --max-time 5 --noproxy '*' http://127.0.0.1:18765/fast -o build/fixture-probe.bin
          build/DownloadSmoke "$PWD/build/download-check" "$PWD/Sources/Neural/NeuralManifest.json" | tee build/download-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veil-download-check
          path: build/download*.log
          retention-days: 14
  neural:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: actions/cache@v4
        with:
          path: build/neural-model
          key: veil-sd21-fp32codec-v1
      - uses: actions/cache@v4
        id: vae
        with:
          path: Sources/Neural/BundledVAE
          key: veil-sd21-fp32-ct9-xcode26.2-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model conversion dependencies
        if: steps.vae.outputs.cache-hit != 'true'
        run: python3 -m pip install torch==2.7.1 coremltools==9.0 diffusers==0.35.1 transformers==4.53.3 safetensors==0.6.2 numpy==1.26.4 Pillow==11.3.0
      - name: Prepare matching full precision image codec
        run: |
          mkdir -p build
          python3 scripts/prepare_vae.py
      - uses: actions/upload-artifact@v4
        with:
          name: Veil-FP32-codec
          path: |
            Sources/Neural/BundledVAE/
            build/NeuralManifest.json
          retention-days: 14
      - name: Run real Core ML image regeneration on a synthetic image
        timeout-minutes: 20
        env:
          VEIL_DIAGNOSTIC_ONLY: ${{ inputs.neural_only && '1' || '0' }}
        run: |
          set -o pipefail
          mkdir -p build
          python3 -c 'import shutil; shutil.rmtree("build/neural-model/smoke", ignore_errors=True)'
          swift run -c release VeilNeuralSmoke "$PWD/build/neural-model" 2>&1 | tee build/neural.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veil-neural-smoke
          path: |
            build/neural.log
            build/neural-model/smoke/
          retention-days: 14
  build:
    if: ${{ !inputs.neural_only }}
    needs: neural
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Veil-FP32-codec
          path: .
      - name: Install generated model manifest
        run: cp build/NeuralManifest.json Sources/Neural/NeuralManifest.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Generate Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build arm64 iPhone application
        run: |
          set -o pipefail
          xcodebuild build -project Veil.xcodeproj -scheme Veil -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build/device.log
          python3 scripts/package_ipa.py
      - uses: actions/upload-artifact@v4
        with:
          name: Veil-unsigned-IPA
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veil-device-log
          path: build/device.log
          retention-days: 14
  test:
    if: ${{ !inputs.neural_only }}
    needs: neural
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Veil-FP32-codec
          path: .
      - name: Install generated model manifest
        run: cp build/NeuralManifest.json Sources/Neural/NeuralManifest.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Generate Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Compile app and test targets
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Veil.xcodeproj -scheme Veil -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/test-compile.log
      - name: Choose and boot iPhone simulator
        id: simulator
        run: python3 scripts/ci_simulator.py
      - name: Unit tests and native UI screenshots
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Veil.xcodeproj -scheme Veil -configuration Debug \
            -destination "$DESTINATION" -derivedDataPath build/simulator \
            -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO 2>&1 | tee build/tests.log
      - name: Export screenshots
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veil-tests-and-screenshots
          path: |
            build/Tests.xcresult
            build/screenshots/
            build/*.log
          retention-days: 14

name: Build and test iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
    needs: [pixel, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Veil-unsigned-IPA
          path: build/artifacts
      - name: Publish verified unsigned IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_release.py
  pixel:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Check full resolution filtering and real OCR on synthetic text
        run: |
          mkdir -p build/pixel-check
          swiftc -O -swift-version 6 -parse-as-library Sources/Processing/PhotoProcessor.swift Sources/Processing/PixelRaster.swift Sources/Processing/PatternProcessor.swift Sources/Processing/GentleClarity.swift Sources/Processing/DetailResampler.swift Tools/PixelSmoke.swift -o build/pixel-check/smoke
          build/pixel-check/smoke build/pixel-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veil-pixel-check
          path: build/pixel-check/
          retention-days: 14
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Generate Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build arm64 iPhone application
        run: |
          set -o pipefail
          xcodebuild build -project Veil.xcodeproj -scheme Veil -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build/device.log
          python3 scripts/package_ipa.py
      - uses: actions/upload-artifact@v4
        with:
          name: Veil-unsigned-IPA
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veil-device-log
          path: build/device.log
          retention-days: 14
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Generate Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Compile app and test targets
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Veil.xcodeproj -scheme Veil -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/test-compile.log
      - name: Choose and boot iPhone simulator
        id: simulator
        run: python3 scripts/ci_simulator.py
      - name: Unit tests and native UI screenshots
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Veil.xcodeproj -scheme Veil -configuration Debug \
            -destination "$DESTINATION" -derivedDataPath build/simulator \
            -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO 2>&1 | tee build/tests.log
      - name: Export screenshots
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veil-tests-and-screenshots
          path: |
            build/Tests.xcresult
            build/screenshots/
            build/*.log
          retention-days: 14

name: Veil
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.8.0'
    CURRENT_PROJECT_VERSION: '10'
targets:
  Veil:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Neural, 'Neural/**', VeilAppDelegate.swift, Licenses, 'Licenses/**']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.corbendallas111.veil
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Veil
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Veil
        CFBundleShortVersionString: '0.8.0'
        CFBundleVersion: '10'
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: 'Veil сохраняет обработанные фото и видео как новые файлы. Оригиналы остаются в медиатеке.'
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
  VeilTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [NeuralTests.swift]
    dependencies:
      - target: Veil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.corbendallas111.veil.tests
        GENERATE_INFOPLIST_FILE: YES
  VeilUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Veil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.corbendallas111.veil.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Veil:
    build:
      targets:
        Veil: all
    test:
      targets: [VeilTests, VeilUITests]
      gatherCoverageData: true
    archive:
      config: Release

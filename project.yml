name: Veil
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.4.0'
    CURRENT_PROJECT_VERSION: '6'
packages:
  StableDiffusion:
    url: https://github.com/apple-aiml-research/ml-stable-diffusion.git
    revision: ea2805dc1945be20561c77e5f6d1d9a5a637cda2
targets:
  Veil:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Neural/BundledVAE, 'Neural/BundledVAE/**']
      - path: Sources/Neural/BundledVAE
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.corbendallas111.veil
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Veil
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Veil
        CFBundleShortVersionString: '0.4.0'
        CFBundleVersion: '6'
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: 'Veil сохраняет обработанное изображение как новое фото. Оригинал остаётся в медиатеке.'
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: StableDiffusion
        product: StableDiffusion
  VeilTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Veil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.corbendallas111.veil.tests
        GENERATE_INFOPLIST_FILE: YES
  VeilUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Veil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.corbendallas111.veil.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Veil:
    build:
      targets:
        Veil: all
    test:
      targets: [VeilTests, VeilUITests]
      gatherCoverageData: true
    archive:
      config: Release
